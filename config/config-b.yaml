meta:
  config_id: config-b
  name: "Single-path / single-mode reference"
  description: >
    Single-path deployment switch (no dual confirmation), no RF inhibit,
    single downlink mode, ground-commanded safe-mode exit only. Deliberately
    dissimilar to Config A to test the engine's generality (RQ1).
  version: "0.2.0"

states:
  - id: S-01
    name: STOWED
    category: deployment
    description: Pre-separation. Deployment not confirmed.
    entry_actions: []
    is_initial: true
  - id: S-02
    name: DEPLOY_CONFIRM_PENDING
    category: deployment
    description: Separation switch closed; debounce timer running before the single confirmation path is trusted. No RF inhibit — this is purely bounce filtering, not a safety silence period.
    entry_actions: [start_switch_debounce_timer]
    is_initial: false
  - id: S-03
    name: DEPLOYED_CONFIRMED
    category: deployment
    description: Debounce elapsed; deployment_confirmed latch set. No dual-path wait, no RF inhibit.
    entry_actions: [set_deployment_confirmed_latch, enable_rf]
    is_initial: false
  - id: S-04
    name: COMMISSIONING
    category: deployment
    description: Initial checkout before nominal downlink begins.
    entry_actions: []
    is_initial: false
  - id: S-05
    name: COMMS_ACTIVE
    category: comms-mode
    description: The single downlink mode — active, regardless of which data class the scheduler is currently serving.
    entry_actions: []
    is_initial: false
  - id: S-06
    name: COMMS_IDLE
    category: comms-mode
    description: No active downlink; awaiting next queued item or next pass.
    entry_actions: []
    is_initial: false
  - id: S-07
    name: SAFE_MODE
    category: safe
    description: Entered on fault/power/watchdog/ground trigger. Exit is ground-commanded only — no autonomous recovery path.
    entry_actions: [suspend_downlink, log_rationale]
    is_initial: false

events:
  - {id: E-01, name: SEPARATION_DETECTED, source: onboard, description: Single separation switch closes.}
  - {id: E-02, name: ENTER_COMMISSIONING, source: onboard, description: Raised once deployment_confirmed latch is set.}
  - {id: E-03, name: COMMISSIONING_COMPLETE, source: onboard, description: Checkout/health checks pass.}
  - {id: E-04, name: SCHEDULER_SELECT_ACTIVE, source: scheduler, description: Scheduler has an eligible item (any data class) to downlink.}
  - {id: E-05, name: SCHEDULER_SELECT_IDLE, source: scheduler, description: No eligible item pending.}
  - {id: E-06, name: PASS_END, source: onboard, description: Ground-station pass ended.}
  - {id: E-07, name: FAULT_DETECTED, source: onboard, description: Non-watchdog fault condition detected.}
  - {id: E-08, name: POWER_LOW, source: onboard, description: Battery SoC crossed safe-mode entry threshold.}
  - {id: E-09, name: WATCHDOG_TIMEOUT, source: onboard, description: Watchdog not serviced within timeout window.}
  - {id: E-10, name: GROUND_SAFE_MODE_CMD, source: ground, description: Ground commands entry into/hold within safe mode.}
  - {id: E-11, name: GROUND_OVERRIDE_EXIT_SAFE, source: ground, description: Ground commands exit from safe mode — the only legal exit.}
  - {id: E-12, name: RESET, source: harness, description: Unconditional reset, injectable at any point including mid-write.}
  - {id: E-13, name: UPLINK_CMD_GENERIC, source: ground, description: Generic uplinked command not otherwise covered.}
  - {id: E-14, name: SWITCH_DEBOUNCE_ELAPSED, source: onboard, description: Deployment-switch debounce timer has elapsed since separation was detected.}
  - {id: E-15, name: COMMS_LOSS_TIMEOUT, source: onboard, description: Ground-contact timer exceeded PB-011 with no intervening telecommand.}

transitions:
  - {id: T-01, from: [S-01], event: E-01, guard: null, to: S-02, actions: [start_switch_debounce_timer], requirements: [RB-01]}
  - {id: T-02, from: [S-02], event: E-14, guard: "elapsed(switch_debounce_timer) >= PB-002", to: S-03, actions: [set_deployment_confirmed_latch, enable_rf, start_ground_contact_timer], requirements: [RB-01, RB-02]}
  - {id: T-03, from: [S-03], event: E-02, guard: null, to: S-04, actions: [], requirements: [RB-03]}
  - {id: T-04, from: [S-04], event: E-03, guard: null, to: S-05, actions: [begin_downlink], requirements: [RB-04]}
  - {id: T-05, from: [S-05, S-06], event: E-04, guard: null, to: S-05, actions: [begin_or_continue_downlink, log_mode_change], requirements: [RB-05]}
  - {id: T-06, from: [S-05, S-06], event: E-05, guard: null, to: S-06, actions: [end_downlink, log_mode_change], requirements: [RB-05]}
  - {id: T-07, from: [S-05, S-06], event: E-06, guard: "elevation < PB-006", to: S-06, actions: [end_downlink, log_pass_end], requirements: [RB-06]}
  - {id: T-08, from: [S-04, S-05, S-06], event: E-07, guard: "fault_count >= PB-005", to: S-07, actions: [suspend_downlink, log_rationale], requirements: [RB-07, RB-11]}
  - {id: T-09, from: [S-04, S-05, S-06], event: E-08, guard: "battery_soc <= PB-003", to: S-07, actions: [suspend_downlink, log_rationale], requirements: [RB-07, RB-11]}
  - {id: T-10, from: [S-04, S-05, S-06], event: E-09, guard: null, to: S-07, actions: [suspend_downlink, log_rationale], requirements: [RB-07, RB-11]}
  - {id: T-11, from: [S-03, S-04, S-05, S-06, S-07], event: E-10, guard: null, to: S-07, actions: [suspend_downlink, log_rationale, start_ground_contact_timer], requirements: [RB-08, RB-11]}
  - {id: T-12, from: [S-07], event: E-11, guard: null, to: S-04, actions: [resume_nominal_rotation, log_rationale, start_ground_contact_timer], requirements: [RB-09, RB-11]}
  - {id: T-13, from: "*", event: E-12, guard: null, to: reload_from_persistence, actions: [reload_from_nvm, start_ground_contact_timer], requirements: [RB-02, RB-10]}
  - {id: T-14, from: "*", event: E-13, guard: null, to: null, actions: [log_command_received, start_ground_contact_timer], requirements: [RB-11]}
  - {id: T-15, from: [S-03, S-04, S-05, S-06], event: E-15, guard: "elapsed(ground_contact_timer) >= PB-011", to: reload_from_persistence, actions: [reload_from_nvm, start_ground_contact_timer], requirements: [RB-12]}

latches:
  - name: deployment_confirmed
    description: Set once the single deployment-confirmation switch closes and the debounce timer elapses.
    set_by: [T-02]
    one_way: true
    survives_reset: true

parameters:
  - {id: P-001, name: data_class_priority_order, value: [TTC, SSTV, CODEC2_M17], applies_to: both, source: "use-case doc, Solution Approach + Governance table", confidence: cited, rationale: "Given directly by the mission document; identical across configs."}
  - {id: P-002, name: power_budget_avg, value: "<1W", applies_to: both, source: "use-case doc", confidence: cited, rationale: "Given directly; identical across configs."}
  - {id: P-004, name: autonomy_bound, value: "uplinked commands + safe-mode triggers only", applies_to: both, source: "use-case doc, Human-in-the-Loop row", confidence: cited, rationale: "Given directly; identical across configs."}
  - {id: P-005, name: collaborating_org, value: "ReOrbit, Finland", applies_to: context, source: "use-case doc", confidence: cited, rationale: "Non-runtime, report traceability only."}
  - {id: PB-001, name: deployment_confirmation_mechanism, value: [separation_switch], applies_to: config-b, source: "plan section 5 (Config B definition)", confidence: cited, rationale: "Config B is defined by the plan itself as single-path — this is a structural given for this config, not an assumption."}
  - {id: PB-002, name: deploy_confirm_debounce_s, value: 5, applies_to: config-b, source: "engineering judgment", confidence: assumed, rationale: "Short debounce to filter switch bounce; no dual-path wait needed since there is only one confirmation path. Consumed by T-02's guard."}
  - {id: PB-003, name: battery_soc_safe_mode_entry_threshold_pct, value: 25, applies_to: config-b, source: "engineering judgment", confidence: assumed, rationale: "Conventional small-sat entry threshold, independently assumed for this config."}
  - {id: PB-004, name: watchdog_timeout_s, value: 120, applies_to: config-b, source: "engineering judgment", confidence: assumed, rationale: "No mission-specific figure; consistent order of magnitude with Config A's assumption."}
  - {id: PB-005, name: fault_count_threshold_for_latched_fault, value: 3, applies_to: config-b, source: "engineering judgment", confidence: assumed, rationale: "Consecutive-count threshold to avoid safe-mode entry on transient fault flags."}
  - {id: PB-006, name: link_quality_min_elevation_deg, value: 10, applies_to: config-b, source: "common ground-station minimum-elevation convention", confidence: assumed, rationale: "Widely used minimum-elevation mask."}
  - {id: PB-007, name: fade_margin_db, value: 3, applies_to: config-b, source: "engineering judgment", confidence: assumed, rationale: "Placeholder pending Phase 4 link-budget validation."}
  - {id: PB-008, name: decision_log_verbosity, value: full, applies_to: config-b, source: "section 3, Responsible AI", confidence: assumed, rationale: "Full logging while log completeness is itself under test."}
  - {id: PB-009, name: ground_override_command_auth_model, value: hmac-sha256, applies_to: config-b, source: "engine/auth.py (Phase 7C)", confidence: assumed, rationale: "Phase 7C update (supersedes the prior TBD/null value): mirrors Config A's P-023 — a real HMAC-SHA256 signature is now required and enforced by engine/fsm.py::step() for every EventDef.source == 'ground' event. Still explicitly scoped to the simulation/engine software layer only — real RF/flight-hardware crypto keying and physical uplink security remain out of scope per the project plan (section 9), unchanged."}
  - {id: PB-010, name: safe_mode_exit_policy, value: ground_only, applies_to: config-b, source: "plan section 5 (Config B definition)", confidence: cited, rationale: "Documentation label describing this config's structure: no autonomous-recovery event or state is defined at all (contrast Config A's P-020). Not read by any guard — see docs/parameters.md review note."}
  - {id: PB-011, name: comms_loss_reset_timer_s, value: 172800, applies_to: config-b, source: "Franzese, Kanavouras, Bruce Rosete et al., System design of the POQUITO PocketQube mission, CEAS Space J 18 (2026), Sect. 3.7 Software architecture", confidence: cited, rationale: "Real POQUITO radiation-mitigation feature: reset of the satellite to a known state if no TC is received from the ground station within 2 days (172800 s). Mirrors Config A's P-025."}

data_class_priority: [TTC, SSTV, CODEC2_M17]

conflict_resolution:
  - {rank: 1, category: ground_override_reset, member_events: [E-10, E-11, E-12], tie_break: "event timestamp, earliest first; RESET always wins ties against ground commands"}
  - {rank: 2, category: fault_watchdog, member_events: [E-07, E-08, E-09, E-15], tie_break: "event timestamp, then event ID lexical order"}
  - {rank: 3, category: deployment_lifecycle, member_events: [E-01, E-02, E-14], tie_break: "event timestamp"}
  - {rank: 4, category: scheduler_data_class, member_events: [E-04, E-05, E-06], tie_break: "ordered by data_class_priority; PASS_END outranks SCHEDULER_SELECT_* within this rank"}
  - {rank: 5, category: routine_informational, member_events: [E-03, E-13], tie_break: "event timestamp"}

mode_exclusivity_groups:
  - group_name: comms_modes
    member_states: [S-05, S-06]
